<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Starz & Cappy — neon rave cyber cat transmission EST. 2020">
  <meta name="theme-color" content="#0a0014">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>STARZ & CAPPY // RAVE FREQUENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff2bd6;
      --cyan: #00f0ff;
      --acid: #c8ff00;
      --violet: #b400ff;
      --yellow: #ffe600;
      --orange: #ff6b00;
      --bg: #070012;
      --bg2: #0e0020;
      --surface: #140028;
      --text: #f0e8ff;
      --muted: #a090c0;
      --ticker-bg: #000;
      --ticker-fg: #39ff14;
      --font-display: "Orbitron", system-ui, sans-serif;
      --font-pixel: "Press Start 2P", monospace;
      --font-body: "Inter", system-ui, sans-serif;
      --ticker-h: 2.6rem;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.55;
      position: relative;
    }

    .rave-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(180,0,255,0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 80%, rgba(0,240,255,0.25), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(255,43,214,0.15), transparent 60%),
        linear-gradient(180deg, #050010 0%, #0c0018 40%, #120028 100%);
    }

    .grid-floor {
      position: fixed; left: -20%; right: -20%; bottom: -10%; height: 55%;
      z-index: 1; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,240,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.15) 1px, transparent 1px);
      background-size: 48px 48px;
      transform: perspective(400px) rotateX(68deg);
      transform-origin: center bottom;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.7), transparent 85%);
      animation: grid-pulse 6s ease-in-out infinite alternate;
    }
    @keyframes grid-pulse {
      0% { opacity: 0.45; filter: hue-rotate(0deg); }
      100% { opacity: 0.85; filter: hue-rotate(40deg); }
    }

    .scanlines {
      position: fixed; inset: 0; z-index: 9990; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
      );
      mix-blend-mode: multiply;
    }

    .vhs {
      position: fixed; inset: 0; z-index: 9991; pointer-events: none;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      animation: vhs-jitter 0.15s steps(2) infinite;
    }
    @keyframes vhs-jitter {
      0% { transform: translate(0,0); }
      50% { transform: translate(-1px, 1px); }
      100% { transform: translate(1px, -1px); }
    }

    .smiley {
      position: fixed; z-index: 2; pointer-events: none;
      font-size: 2.2rem; opacity: 0.55;
      filter: drop-shadow(0 0 8px var(--acid));
      animation: float-smiley 14s ease-in-out infinite;
    }
    .smiley:nth-child(1) { left: 8%; top: 22%; animation-delay: 0s; }
    .smiley:nth-child(2) { left: 78%; top: 38%; animation-delay: -4s; font-size: 1.6rem; }
    .smiley:nth-child(3) { left: 55%; top: 12%; animation-delay: -8s; font-size: 1.3rem; }
    @keyframes float-smiley {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-28px) rotate(12deg); }
    }

    .led-border {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      border: 4px solid var(--cyan);
      box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--pink), inset 0 0 30px rgba(0,240,255,0.12);
      animation: border-rave 3s linear infinite;
    }
    @keyframes border-rave {
      0%   { border-color: var(--pink);   box-shadow: 0 0 18px var(--pink), 0 0 36px var(--violet); }
      25%  { border-color: var(--cyan);   box-shadow: 0 0 22px var(--cyan), 0 0 44px var(--acid); }
      50%  { border-color: var(--acid);   box-shadow: 0 0 20px var(--acid), 0 0 40px var(--yellow); }
      75%  { border-color: var(--violet); box-shadow: 0 0 22px var(--violet), 0 0 44px var(--pink); }
      100% { border-color: var(--pink);   box-shadow: 0 0 18px var(--pink), 0 0 36px var(--violet); }
    }

    /* truncated for this example - in real call the full 34k would be here */
  </style>
</head>
